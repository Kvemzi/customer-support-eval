name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # manual trigger for the (paid) LLM evaluation

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      SUT_BACKEND: mock     # no API key needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/unit -q

  llm-evals:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUT_BACKEND: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: deepeval test run tests/evals/test_suite.py